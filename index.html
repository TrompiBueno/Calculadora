<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Calculadora de Alta Precisión</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/decimal.js/10.4.3/decimal.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .calculator {
        background: white;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        max-width: 400px;
        width: 100%;
      }
      .calculator input,
      .calculator select {
        width: 100%;
        padding: 0.6rem;
        margin-bottom: 1rem;
        font-size: 1rem;
      }
      .calculator button {
        width: 100%;
        padding: 0.8rem;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
      }
      .calculator button:hover {
        background: #0056b3;
      }
      .result {
        margin-top: 1rem;
        font-weight: bold;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="calculator">
      <h2>Calculadora de Alta Precisión</h2>
      <input
        type="text"
        id="num1"
        placeholder="Número 1 (puedes usar pi o e)"
      />
      <input
        type="text"
        id="num2"
        placeholder="Número 2 (según la operación)"
      />
      <select id="operation">
        <option value="add">Suma</option>
        <option value="sub">Resta</option>
        <option value="mul">Multiplicación</option>
        <option value="div">División</option>
        <option value="pow">Potencia</option>
        <option value="fact">Factorial</option>
      </select>
      <button onclick="calcular()">Calcular</button>
      <div class="result" id="resultado"></div>
    </div>

    <script>
      Decimal.set({ precision: 100 });

      function interpretarValor(valor) {
        valor = valor.trim().toLowerCase();
        if (valor === "pi") return Decimal.acos(-1);
        if (valor === "e") return Decimal.exp(1);
        return new Decimal(valor);
      }

      function factorial(n) {
        if (!n.isInteger() || n.isNegative())
          throw new Error("Solo factoriales de enteros no negativos");
        let result = new Decimal(1);
        for (let i = new Decimal(2); i.lte(n); i = i.plus(1)) {
          result = result.times(i);
        }
        return result;
      }

      function calcular() {
        try {
          const val1 = document.getElementById("num1").value;
          const val2 = document.getElementById("num2").value;
          const num1 = interpretarValor(val1);
          const operation = document.getElementById("operation").value;
          let result;

          switch (operation) {
            case "add":
              result = num1.plus(interpretarValor(val2));
              break;
            case "sub":
              result = num1.minus(interpretarValor(val2));
              break;
            case "mul":
              result = num1.times(interpretarValor(val2));
              break;
            case "div":
              result = num1.dividedBy(interpretarValor(val2));
              break;
            case "pow":
              result = num1.pow(interpretarValor(val2));
              break;
            case "fact":
              result = factorial(num1);
              break;
            default:
              throw new Error("Operación no soportada");
          }

          document.getElementById("resultado").innerText =
            "Resultado: " + result.toFixed();
        } catch (e) {
          document.getElementById("resultado").innerText =
            "Error: " + e.message;
        }
      }
    </script>
  </body>
</html>
